<main>
<h2>Become a Reseller</h2>
<p>Join the MaRL family and start reselling our premium cleaning products. Enjoy competitive wholesale pricing, territory protection, and ongoing support.</p>
<form id="resellerForm">
<label for="name">Full Name:</label><br>
<input type="text" id="name" name="name" required><br>

<label for="email">Email:</label><br>
<input type="email" id="email" name="email" required><br>

<label for="phone">Phone Number:</label><br>
<input type="tel" id="phone" name="phone" required><br>

<label for="territory">Territory:</label><br>
<input type="text" id="territory" name="territory" placeholder="e.g., North Region, City Name" required><br>

<button type="submit">Apply to Resell</button>
</form>
</main>

<script>
document.getElementById('resellerForm').addEventListener('submit', function(e) {
  e.preventDefault();
  alert('Thank you for applying! We will contact you soon.');
  this.reset();
});
</script>
