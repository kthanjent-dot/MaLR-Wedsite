<main>
<h2>Contact Us</h2>
<p>Have a question or inquiry? We'd love to hear from you. Fill out the form below and our team will get back to you as soon as possible.</p>
<form id="contactForm">
<label for="name">Full Name:</label><br>
<input type="text" id="name" name="name" required><br>

<label for="email">Email:</label><br>
<input type="email" id="email" name="email" required><br>

<label for="message">Message:</label><br>
<textarea id="message" name="message" rows="4" placeholder="Tell us how we can help..." required></textarea><br>

<button type="submit">Send Message</button>
</form>
</main>

<script>
document.getElementById('contactForm').addEventListener('submit', function(e) {
  e.preventDefault();
  alert('Thank you for reaching out! We will contact you soon.');
  this.reset();
});
</script>
